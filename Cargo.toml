[package]
name = "chatoid"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Peer-hosted desktop chat for people and Codex agents"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
cap-fs-ext = "3"
cap-std = "3"
chacha20poly1305 = "0.10"
directories = "6"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fs2 = "0.4"
getrandom = "0.3"
if-addrs = "0.13"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"
zeroize = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

